name: Release to Play Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to publish, e.g. 1.8'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -qE '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::'$INPUT_VERSION' is not a version like 1.9 or 1.9.1"
            exit 1
          fi
          echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty secrets:$missing"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Decoded keystore is empty; check the KEYSTORE_BASE64 secret"
            exit 1
          fi

      - name: Create service account file
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_account.json"
          if ! grep -q '"type"' "$RUNNER_TEMP/service_account.json"; then
            echo "::error::Service account file does not look like a credentials JSON"
            exit 1
          fi

      - name: Publish to Play Store (internal track)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/service_account.json
        run: |
          echo "Publishing version: $VERSION"
          ./gradlew publishReleaseBundle -PversionName="$VERSION"

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          rm -f "$RUNNER_TEMP/service_account.json"
